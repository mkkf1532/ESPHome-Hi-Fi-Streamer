# ==============================================================================
# Project: Hi-Fi Network Audio Streamer & Cyber HUD (ESP32-S3 + PCM5102A + ST7789)
# Author:  Maciej_Kow
# Version: 1.0.0
# License: MIT
# ==============================================================================
# First-Time Setup (Wi-Fi Provisioning):
# After flashing, the device automatically creates an open Wi-Fi Hotspot:
# SSID: "HiFi-Streamer-Setup"
# Connect to it using your phone or PC — a Captive Portal page will open
# automatically (or visit http://192.168.4.1) to select your Wi-Fi network.
# ==============================================================================

substitutions:
  device_name: "hifi-streamer"
  friendly_name: "Hi-Fi Streamer"

  # Home Assistant & Music Assistant network configuration (Album Art & DSP EQ)
  ha_ip: "192.168.1.100"
  ha_port: "8123"
  ma_port: "8095"
  ma_token: "Bearer YOUR_MUSIC_ASSISTANT_TOKEN"
  ma_player_entity: "media_player.hifi_streamer"
  ma_dsp_player_id: "media_player.hifi_streamer"

  # Optional outdoor temperature entity from Home Assistant
  # (used as a fallback if no DS18B20 probe is connected to GPIO40)
  outdoor_temp_entity: "sensor.outdoor_temperature"

  # Onboard environmental sensor pins on the main ESP32-S3
  i2c_sda_pin: "GPIO41"     # I2C SDA (AHT20 + BMP280)
  i2c_scl_pin: "GPIO42"     # I2C SCL (AHT20 + BMP280)
  onewire_pin: "GPIO40"     # 1-Wire data pin (external DS18B20 probe)

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: Maciej_Kow.HiFi_Streamer
    version: "1.0.0"
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      - delay: 350ms
      - lambda: |-
          if (id(streamer_player).volume >= 0.30f) {
            id(vol_target) = id(streamer_player).volume;
          } else {
            id(vol_target) = 0.50f;
          }
      - if:
          condition:
            binary_sensor.is_on: power_switch
          then:
            - script.execute: apply_power_on
          else:
            - script.execute: apply_power_off

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

# 8MB Octal PSRAM @ 80MHz (for ESP32-S3 N16R8 modules)
psram:
  mode: octal
  speed: 80MHz

logger:
  baud_rate: 0
  level: INFO

api:

ota:
  - platform: esphome

# ==============================================================================
# 0. WI-FI HOTSPOT & CAPTIVE PORTAL (ZERO-CONFIG PROVISIONING)
# ==============================================================================
wifi:
  min_auth_mode: WPA2
  power_save_mode: none
  ap:
    ssid: "HiFi-Streamer-Setup"

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

http_request:
  verify_ssl: false
  timeout: 5s

globals:
  - id: has_album_art
    type: bool
    initial_value: 'false'
  - id: last_art_url
    type: std::string
    initial_value: '""'
  - id: current_screen
    type: int
    initial_value: '0'   # 0 = Spotify / Now Playing, 1 = Weather / Temperatures
  - id: bg_cur_top_r
    type: float
    initial_value: '24.0'
  - id: bg_cur_top_g
    type: float
    initial_value: '30.0'
  - id: bg_cur_top_b
    type: float
    initial_value: '46.0'
  - id: bg_target_top_r
    type: float
    initial_value: '24.0'
  - id: bg_target_top_g
    type: float
    initial_value: '30.0'
  - id: bg_target_top_b
    type: float
    initial_value: '46.0'

  - id: bg_cur_bot_r
    type: float
    initial_value: '14.0'
  - id: bg_cur_bot_g
    type: float
    initial_value: '18.0'
  - id: bg_cur_bot_b
    type: float
    initial_value: '28.0'
  - id: bg_target_bot_r
    type: float
    initial_value: '14.0'
  - id: bg_target_bot_g
    type: float
    initial_value: '18.0'
  - id: bg_target_bot_b
    type: float
    initial_value: '28.0'
  - id: cover_anim
    type: float
    initial_value: '1.0'
  - id: active_art_idx
    type: int
    initial_value: '0'
  - id: target_art_idx
    type: int
    initial_value: '0'
  - id: art_transition
    type: float
    initial_value: '1.0'

  # Volume accumulator in RAM for instant (0 ms lag) rotary encoder response
  - id: vol_target
    type: float
    initial_value: '0.50'
  - id: vol_dirty
    type: bool
    initial_value: 'false'
  - id: last_enc_ms
    type: uint32_t
    initial_value: '0'

# Dynamic double-buffered album art (128x128 px) in PSRAM with smooth crossfade
image:
  - platform: online_image
    id: album_art_0
    url: "http://${ha_ip}:${ha_port}/static/icons/favicon.ico"
    format: JPEG
    type: RGB565
    resize: 128x128
    update_interval: never
    on_download_finished:
      - lambda: |-
          if (id(target_art_idx) == 0) {
            id(art_transition) = 0.0f;
            id(cover_anim) = 0.0f;
          }

  - platform: online_image
    id: album_art_1
    url: "http://${ha_ip}:${ha_port}/static/icons/favicon.ico"
    format: JPEG
    type: RGB565
    resize: 128x128
    update_interval: never
    on_download_finished:
      - lambda: |-
          if (id(target_art_idx) == 1) {
            id(art_transition) = 0.0f;
            id(cover_anim) = 0.0f;
          }

# ==============================================================================
# 1. HARDWARE BUSES: SPI (ST7789), I2S (PCM5102A), I2C (AHT20/BMP280), 1-Wire
# ==============================================================================
spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  interface: hardware

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true
  frequency: 100kHz

one_wire:
  - platform: gpio
    pin: ${onewire_pin}
    id: onewire_bus

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO16   # DAC LCK / WS
    i2s_bclk_pin: GPIO15    # DAC BCK

speaker:
  # 1. Physical I2S output to external PCM5102A DAC
  - platform: i2s_audio
    id: dac_physical_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO17    # DAC DIN
    channel: stereo
    sample_rate: 48000
    bits_per_sample: 32bit
    timeout: never

  # 2. Hardware mixer: seamless playback of music, TTS announcements, and Sendspin
  - platform: mixer
    id: dac_mixer
    output_speaker: dac_physical_speaker
    source_speakers:
      - id: spk_media_in          # Main music pipeline
        buffer_duration: 250ms
        timeout: never
      - id: spk_announcement_in   # TTS / Announcements pipeline
        buffer_duration: 500ms
        timeout: 500ms
      - id: spk_sendspin_in       # Synchronized Sendspin multi-room pipeline
        buffer_duration: 250ms
        timeout: never

# ==============================================================================
# SENDSPIN PROTOCOL: MILLISECOND-ACCURATE MULTI-ROOM SYNCHRONIZATION
# ==============================================================================
sendspin:

media_source:
  - platform: sendspin
    id: sendspin_source
    initial_static_delay: 0ms
    static_delay_adjustable: true

media_player:
  - platform: speaker
    id: streamer_player
    name: "Hi-Fi Streamer"
    # Main audio pipeline (Music Assistant / FLAC / PCM)
    media_pipeline:
      speaker: spk_media_in
      format: NONE
      num_channels: 2
    # Announcement pipeline (Home Assistant TTS / Chimes)
    announcement_pipeline:
      speaker: spk_announcement_in
      format: NONE
      num_channels: 2
    buffer_size: 350000     # ~350 KB in PSRAM (~0.95s PCM)
    volume_increment: 0.014
    on_volume:
      - lambda: |-
          if (millis() - id(last_enc_ms) > 250) {
            id(vol_target) = x;
          }
    on_play:
      - if:
          condition:
            not:
              binary_sensor.is_on: power_switch
          then:
            - media_player.stop: streamer_player
          else:
            - light.turn_on:
                id: led_blue
                brightness: 20%
    on_idle:
      - light.turn_off: led_blue

  # Sendspin player for multi-room synchronization
  - platform: speaker_source
    id: sendspin_player
    name: "Sendspin Streamer"
    media_pipeline:
      speaker: spk_sendspin_in
      sources:
        - sendspin_source
    volume_increment: 0.014
    on_play:
      - if:
          condition:
            not:
              binary_sensor.is_on: power_switch
          then:
            - media_player.stop: sendspin_player
          else:
            - light.turn_on:
                id: led_blue
                brightness: 20%
    on_idle:
      - if:
          condition:
            lambda: |-
              return id(streamer_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING;
          then:
            - light.turn_off: led_blue

  # Sendspin Group entity in Home Assistant / Music Assistant
  - platform: sendspin
    name: "Sendspin Group"


# ==============================================================================
# 2. DISPLAY BACKLIGHT (PWM 0-100% -> 30-100% HW) & RGB STATUS LED
# ==============================================================================
output:
  - platform: ledc
    pin: GPIO13
    id: tft_backlight_pwm
    frequency: 25000Hz  # Ultrasonic 25 kHz PWM - eliminates coil whine

  # Slider mapping: 0% gives 0% hardware PWM (zero glow), >0% scales 30-100%
  - platform: template
    id: tft_backlight_mapped
    type: float
    write_action:
      - lambda: |-
          if (state <= 0.001f) {
            id(tft_backlight_pwm).set_level(0.0f);
          } else {
            float hw_level = 0.30f + state * 0.70f;
            id(tft_backlight_pwm).set_level(hw_level);
          }

  # Status RGB LED (G=GPIO8, R=GPIO18, B=GPIO21)
  - platform: ledc
    pin: GPIO8
    id: out_led_green
  - platform: ledc
    pin: GPIO18
    id: out_led_red
  - platform: ledc
    pin: GPIO21
    id: out_led_blue

light:
  - platform: monochromatic
    output: tft_backlight_mapped
    name: "Display Backlight"
    id: tft_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    gamma_correct: 0.0

  - platform: monochromatic
    output: out_led_green
    id: led_green
    internal: true
  - platform: monochromatic
    output: out_led_red
    id: led_red
    internal: true
  - platform: monochromatic
    output: out_led_blue
    id: led_blue
    internal: true


# ==============================================================================
# 3. POWER TOGGLE SWITCH (Soft-Standby) & ENCODER MULTI-CLICK BUTTON
# ==============================================================================
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO7
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Power Toggle Switch"
    id: power_switch
    trigger_on_initial_state: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - script.execute: apply_power_on
    on_release:
      then:
        - script.execute: apply_power_off

  - platform: gpio
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Encoder Button"
    id: encoder_button
    filters:
      - delayed_on: 8ms
      - delayed_off: 8ms
    on_multi_click:
      # Long press (Hold > 450ms) -> Toggle active screen (when powered ON)
      - timing:
          - ON for at least 450ms
        then:
          - if:
              condition:
                binary_sensor.is_on: power_switch
              then:
                - logger.log: "Encoder hold: Toggle screen"
                - lambda: |-
                    id(current_screen) = (id(current_screen) == 0) ? 1 : 0;
                - light.turn_on:
                    id: led_blue
                    brightness: 25%
                - delay: 80ms
                - if:
                    condition:
                      lambda: |-
                        return (id(streamer_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING && id(ma_player_state).state != "playing");
                    then:
                      - light.turn_off: led_blue

      # Double click -> Next track (Skip track)
      - timing:
          - ON for at most 280ms
          - OFF for at most 220ms
          - ON for at most 280ms
          - OFF for at least 20ms
        then:
          - logger.log: "Encoder double-click: Next track"
          - if:
              condition:
                binary_sensor.is_on: power_switch
              then:
                - homeassistant.service:
                    service: media_player.media_next_track
                    data:
                      entity_id: ${ma_player_entity}

      # Single click -> Play/Pause when ON, Toggle backlight when in Standby
      - timing:
          - ON for at most 300ms
          - OFF for at least 150ms
        then:
          - if:
              condition:
                binary_sensor.is_on: power_switch
              then:
                - logger.log: "Encoder single-click: Play/Pause"
                - if:
                    condition:
                      lambda: |-
                        return (id(streamer_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING || id(ma_player_state).state == "playing");
                    then:
                      - media_player.pause: streamer_player
                      - homeassistant.service:
                          service: media_player.media_pause
                          data:
                            entity_id: ${ma_player_entity}
                    else:
                      - media_player.play: streamer_player
                      - homeassistant.service:
                          service: media_player.media_play
                          data:
                            entity_id: ${ma_player_entity}
              else:
                - if:
                    condition:
                      lambda: |-
                        return id(tft_backlight).current_values.is_on();
                    then:
                      - logger.log: "Standby: Turning display backlight OFF"
                      - light.turn_off: tft_backlight
                    else:
                      - logger.log: "Standby: Waking display backlight to 70%"
                      - light.turn_on:
                          id: tft_backlight
                          brightness: 70%

# ==============================================================================
# 3.5 DIRECT PARAMETRIC EQ DSP CONTROL (ESP32-S3 -> MUSIC ASSISTANT RPC API)
# ==============================================================================
script:
  - id: apply_power_on
    then:
      - light.turn_off: led_red
      - light.turn_on:
          id: led_green
          brightness: 12%
      - globals.set:
          id: current_screen
          value: '0'
      - light.turn_on:
          id: tft_backlight
          brightness: 100%
      - lambda: |-
          if (id(streamer_player).volume < 0.30f) {
            id(vol_target) = 0.30f;
            auto call = id(streamer_player).make_call();
            call.set_volume(0.30f);
            call.perform();
          } else {
            id(vol_target) = id(streamer_player).volume;
          }
      - script.execute: send_dsp_update

  - id: apply_power_off
    then:
      - media_player.stop: streamer_player
      - media_player.stop: sendspin_player
      - homeassistant.service:
          service: media_player.media_pause
          data:
            entity_id: ${ma_player_entity}
      - light.turn_off: led_green
      - light.turn_off: led_blue
      - light.turn_on:
          id: led_red
          brightness: 15%
      - globals.set:
          id: current_screen
          value: '1'
      - light.turn_on:
          id: tft_backlight
          brightness: 70%

  - id: send_dsp_update
    mode: restart
    then:
      - delay: 600ms
      - if:
          condition:
            - wifi.connected:
            - binary_sensor.is_on: power_switch
          then:
            - http_request.post:
                url: "http://${ha_ip}:${ma_port}/api"
                request_headers:
                  Content-Type: "application/json"
                  Authorization: "${ma_token}"
                body: !lambda |-
                  float b = isnan(id(pot_bass).state) ? 0.0f : id(pot_bass).state;
                  float t = isnan(id(pot_treble).state) ? 0.0f : id(pot_treble).state;
                  bool dsp_on = (fabsf(b) >= 0.1f || fabsf(t) >= 0.1f);
                  float max_boost = 0.0f;
                  if (b > max_boost) max_boost = b;
                  if (t > max_boost) max_boost = t;
                  float preamp = (max_boost > 0.0f) ? -max_boost : 0.0f;
                  char buf[512];
                  snprintf(buf, sizeof(buf),
                    "{\"command\":\"config/players/dsp/save\",\"args\":{\"player_id\":\"${ma_dsp_player_id}\",\"config\":{\"enabled\":%s,\"filters\":[{\"enabled\":true,\"preamp\":%.1f,\"per_channel_preamp\":{},\"type\":\"parametric_eq\",\"bands\":[{\"frequency\":60.0,\"q\":1.0,\"gain\":%.1f,\"type\":\"low_shelf\",\"enabled\":true,\"channel\":\"ALL\"},{\"frequency\":10000.0,\"q\":1.0,\"gain\":%.1f,\"type\":\"high_shelf\",\"enabled\":true,\"channel\":\"ALL\"}]}],\"input_gain\":0.0,\"output_gain\":0.0,\"preset_id\":null}}}",
                    dsp_on ? "true" : "false", preamp, b, t
                  );
                  return std::string(buf);

# ==============================================================================
# 3.8 ENCODER VOLUME SYNCHRONIZATION (ZERO-LAG QUEUE COALESCING)
# ==============================================================================
interval:
  - interval: 25ms
    then:
      - lambda: |-
          if (id(vol_dirty)) {
            id(vol_dirty) = false;
            float target = id(vol_target);
            auto call = id(streamer_player).make_call();
            call.set_volume(target);
            call.perform();
            if (id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
              auto call_ss = id(sendspin_player).make_call();
              call_ss.set_volume(target);
              call_ss.perform();
            }
          }

# ==============================================================================
# 4. ROTARY ENCODER, EQ POTENTIOMETERS & ONBOARD ESP32-S3 SENSORS
# ==============================================================================
sensor:
  # Rotary volume encoder with instant RAM accumulation and 3-stage velocity curve
  - platform: rotary_encoder
    name: "Volume Encoder"
    id: volume_encoder
    internal: true
    restore_mode: ALWAYS_ZERO
    pin_a:
      number: GPIO4
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO5
      mode:
        input: true
        pullup: true
    resolution: 1
    on_clockwise:
      - lambda: |-
          if (!id(power_switch).state) return;
          uint32_t now = millis();
          uint32_t dt = now - id(last_enc_ms);
          id(last_enc_ms) = now;
          float step = (dt < 40) ? 0.035f : ((dt < 85) ? 0.021f : 0.014f);
          float v = id(vol_target) + step;
          if (v > 1.0f) v = 1.0f;
          id(vol_target) = v;
          id(vol_dirty) = true;
    on_anticlockwise:
      - lambda: |-
          if (!id(power_switch).state) return;
          uint32_t now = millis();
          uint32_t dt = now - id(last_enc_ms);
          id(last_enc_ms) = now;
          float step = (dt < 40) ? 0.035f : ((dt < 85) ? 0.021f : 0.014f);
          float v = id(vol_target) - step;
          if (v < 0.30f) v = 0.30f;
          id(vol_target) = v;
          id(vol_dirty) = true;

  # Bass & Treble analog potentiometers (±6dB range, 0.5dB step)
  - platform: adc
    pin: GPIO2
    name: "Bass EQ"
    id: pot_bass
    attenuation: 12db
    update_interval: 150ms
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 7
          send_every: 2
      - calibrate_linear:
          - 0.05 -> 6.0
          - 1.72 -> 0.0
          - 3.25 -> -6.0
      - clamp:
          min_value: -6.0
          max_value: 6.0
      - lambda: |-
          if (fabsf(x) < 0.35f) return 0.0f;
          return roundf(x * 2.0f) / 2.0f;
      - delta: 0.25
    on_value:
      then:
        - script.execute: send_dsp_update

  - platform: adc
    pin: GPIO3
    name: "Treble EQ"
    id: pot_treble
    attenuation: 12db
    update_interval: 150ms
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 7
          send_every: 2
      - calibrate_linear:
          - 0.05 -> 6.0
          - 1.72 -> 0.0
          - 3.25 -> -6.0
      - clamp:
          min_value: -6.0
          max_value: 6.0
      - lambda: |-
          if (fabsf(x) < 0.35f) return 0.0f;
          return roundf(x * 2.0f) / 2.0f;
      - delta: 0.25
    on_value:
      then:
        - script.execute: send_dsp_update

  # --- ONBOARD ENVIRONMENTAL SENSORS CONNECTED DIRECTLY TO ESP32-S3 ---
  # 1. AHT20 (I2C 0x38): Room temperature and relative humidity
  - platform: aht10
    variant: AHT20
    address: 0x38
    temperature:
      name: "Room Temperature (AHT20)"
      id: room_temp
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 2
    humidity:
      name: "Room Humidity (AHT20)"
      id: room_humidity
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 2
    update_interval: 15s

  # 2. BMP280 (I2C 0x77): Atmospheric pressure and reference temperature
  - platform: bmp280_i2c
    address: 0x77
    temperature:
      name: "Room Temperature (BMP280)"
      id: room_temp_bmp280
      accuracy_decimals: 1
    pressure:
      name: "Atmospheric Pressure"
      id: atmospheric_pressure
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 2
    update_interval: 15s

  # 3. DS18B20 (1-Wire): External temperature probe connected to ESP32-S3
  - platform: dallas_temp
    one_wire_id: onewire_bus
    name: "Outdoor Temperature (DS18B20)"
    id: outdoor_temp_ds18b20
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 2
    update_interval: 15s

  # ESP32-S3 internal core temperature
  - platform: internal_temperature
    name: "CPU Temperature"
    id: cpu_temp
    update_interval: 5s

  # Wi-Fi diagnostic signal sensor
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_rssi
    update_interval: 10s
    entity_category: diagnostic

  # Track duration and position from Home Assistant (Music Assistant)
  - platform: homeassistant
    id: media_duration
    entity_id: ${ma_player_entity}
    attribute: media_duration
    internal: true

  - platform: homeassistant
    id: media_position
    entity_id: ${ma_player_entity}
    attribute: media_position
    internal: true

  # Optional outdoor temperature entity from Home Assistant (fallback when no DS18B20 is attached)
  - platform: homeassistant
    id: outdoor_temp_ha
    entity_id: ${outdoor_temp_entity}
    internal: true

# ==============================================================================
# 5. TEXT SENSORS: MEDIA METADATA, ALBUM ARTWORK & NETWORK DIAGNOSTICS
# ==============================================================================
text_sensor:
  - platform: sendspin
    type: title
    name: "Sendspin Title"

  - platform: sendspin
    type: artist
    name: "Sendspin Artist"

  - platform: homeassistant
    id: ma_player_state
    entity_id: ${ma_player_entity}
    internal: true

  - platform: homeassistant
    id: media_title
    entity_id: ${ma_player_entity}
    attribute: media_title
    internal: true

  - platform: homeassistant
    id: media_artist
    entity_id: ${ma_player_entity}
    attribute: media_artist
    internal: true

  - platform: homeassistant
    id: raw_entity_picture
    entity_id: ${ma_player_entity}
    attribute: entity_picture
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x.empty()) {
              id(has_album_art) = false;
              id(last_art_url) = "";
              return;
            }
            std::string full_url = x;
            if (x.rfind("http", 0) != 0) {
              full_url = "http://${ha_ip}:${ha_port}" + x;
            }
            // Fetch 160px JPEG album artwork from Music Assistant / Home Assistant
            size_t sz_pos = full_url.find("size=");
            if (sz_pos != std::string::npos) {
              size_t amp_pos = full_url.find('&', sz_pos);
              if (amp_pos != std::string::npos) {
                full_url.replace(sz_pos, amp_pos - sz_pos, "size=160");
              } else {
                full_url.replace(sz_pos, full_url.length() - sz_pos, "size=160");
              }
            } else {
              full_url += (full_url.find('?') == std::string::npos ? "?size=160" : "&size=160");
            }
            size_t fmt_pos = full_url.find("fmt=png");
            if (fmt_pos != std::string::npos) {
              full_url.replace(fmt_pos, 7, "fmt=jpg");
            }
            if (full_url != id(last_art_url)) {
              id(last_art_url) = full_url;
              int next_idx = 1 - id(active_art_idx);
              id(target_art_idx) = next_idx;
              if (next_idx == 0) {
                id(album_art_0)->set_url(full_url);
                id(album_art_0)->update();
              } else {
                id(album_art_1)->set_url(full_url);
                id(album_art_1)->update();
              }
              id(has_album_art) = true;
            }

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      id: wifi_ssid_text
      entity_category: diagnostic
    bssid:
      name: "WiFi BSSID"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

