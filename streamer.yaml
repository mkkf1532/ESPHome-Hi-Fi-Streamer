color:
  - id: c_black
    hex: "000000"
  - id: c_bg
    hex: "0A0D14"
  - id: c_card_bg
    hex: "121824"
  - id: c_card_border
    hex: "1E293B"
  - id: c_cyan
    hex: "00F2FE"
  - id: c_amber
    hex: "FFB800"
  - id: c_purple
    hex: "9D4EDD"
  - id: c_white
    hex: "FFFFFF"
  - id: c_subtle
    hex: "2A3547"
  - id: c_text_muted
    hex: "8A99AD"

display:
  - platform: ili9xxx
    model: ST7789V
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO14
    dimensions:
      height: 320
      width: 240
    rotation: 90
    invert_colors: false
    data_rate: 80MHz        # 80MHz Hardware SPI - 2x faster frame transfer, non-blocking encoder loop
    update_interval: 40ms   # 25 FPS
    lambda: |-
      bool is_playing = (id(ma_player_state).state == "playing" || id(streamer_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
      bool is_paused = (id(ma_player_state).state == "paused");

      float b_db = isnan(id(pot_bass).state) ? 0.0f : id(pot_bass).state;
      float t_db = isnan(id(pot_treble).state) ? 0.0f : id(pot_treble).state;

      // =========================================================================
      // ACTIVE SCREEN SELECTION (0 = NOW PLAYING, 1 = WEATHER / TEMPERATURES)
      // =========================================================================
      if (!id(tft_backlight).current_values.is_on()) {
        it.fill(Color(0, 0, 0));
        return;
      }
      int active_screen = id(current_screen);
      if (!id(power_switch).state) {
        active_screen = 1;
      }

      if (active_screen == 0) {
        // =========================================================================
        // SCREEN 1: SPOTIFY / APPLE MUSIC "NOW PLAYING"
        // =========================================================================
        auto *img_prev = (id(active_art_idx) == 0) ? id(album_art_0) : id(album_art_1);
        auto *img_next = (id(target_art_idx) == 0) ? id(album_art_0) : id(album_art_1);

        bool show_prev = (id(has_album_art) && img_prev->is_loaded());
        bool show_next = (id(has_album_art) && img_next->is_loaded());

        auto *sample_art = (show_next && id(active_art_idx) != id(target_art_idx)) ? img_next : (show_prev ? img_prev : nullptr);
        if (sample_art != nullptr && sample_art->is_loaded()) {
          static std::string last_sampled_url = "";
          if (last_sampled_url != id(last_art_url)) {
            last_sampled_url = id(last_art_url);

            float top_r = 0, top_g = 0, top_b = 0;
            int top_samples = 0;
            float bot_r = 0, bot_g = 0, bot_b = 0;
            int bot_samples = 0;

            int w = sample_art->get_width();
            int h = sample_art->get_height();
            if (w > 0 && h > 0) {
              int mid_y = h / 2;
              for (int sy = 8; sy < mid_y - 4; sy += 12) {
                for (int sx = 8; sx < w - 8; sx += 14) {
                  Color c = sample_art->get_pixel(sx, sy);
                  top_r += c.r; top_g += c.g; top_b += c.b;
                  top_samples++;
                }
              }
              for (int sy = mid_y + 4; sy < h - 8; sy += 12) {
                for (int sx = 8; sx < w - 8; sx += 14) {
                  Color c = sample_art->get_pixel(sx, sy);
                  bot_r += c.r; bot_g += c.g; bot_b += c.b;
                  bot_samples++;
                }
              }
            }

            if (top_samples > 0) {
              float ar = top_r / top_samples;
              float ag = top_g / top_samples;
              float ab = top_b / top_samples;
              float mx = std::max({ar, ag, ab});
              float scale = (mx > 10.0f) ? std::min(1.8f, 75.0f / mx) : 1.0f;
              id(bg_target_top_r) = std::min(220.0f, ar * scale + 8.0f);
              id(bg_target_top_g) = std::min(220.0f, ag * scale + 8.0f);
              id(bg_target_top_b) = std::min(220.0f, ab * scale + 8.0f);
            }
            if (bot_samples > 0) {
              float ar = bot_r / bot_samples;
              float ag = bot_g / bot_samples;
              float ab = bot_b / bot_samples;
              float mx = std::max({ar, ag, ab});
              float scale = (mx > 10.0f) ? std::min(1.8f, 70.0f / mx) : 1.0f;
              id(bg_target_bot_r) = std::min(220.0f, ar * scale + 6.0f);
              id(bg_target_bot_g) = std::min(220.0f, ag * scale + 6.0f);
              id(bg_target_bot_b) = std::min(220.0f, ab * scale + 6.0f);
            }
          }
        } else if (!id(has_album_art)) {
          id(bg_target_top_r) = 22.0f;
          id(bg_target_top_g) = 30.0f;
          id(bg_target_top_b) = 46.0f;
          id(bg_target_bot_r) = 14.0f;
          id(bg_target_bot_g) = 18.0f;
          id(bg_target_bot_b) = 28.0f;
        }

        // Smooth ambient background color interpolation (lerp)
        id(bg_cur_top_r) += (id(bg_target_top_r) - id(bg_cur_top_r)) * 0.035f;
        id(bg_cur_top_g) += (id(bg_target_top_g) - id(bg_cur_top_g)) * 0.035f;
        id(bg_cur_top_b) += (id(bg_target_top_b) - id(bg_cur_top_b)) * 0.035f;

        id(bg_cur_bot_r) += (id(bg_target_bot_r) - id(bg_cur_bot_r)) * 0.035f;
        id(bg_cur_bot_g) += (id(bg_target_bot_g) - id(bg_cur_bot_g)) * 0.035f;
        id(bg_cur_bot_b) += (id(bg_target_bot_b) - id(bg_cur_bot_b)) * 0.035f;

        id(cover_anim) += (1.0f - id(cover_anim)) * 0.12f;

        // Optimized 2-line strip gradient rendering
        for (int y = 0; y < 240; y += 2) {
          float factor = (float)y / 239.0f;
          float curve = factor * factor * (3.0f - 2.0f * factor);
          uint8_t r = (uint8_t)(id(bg_cur_top_r) + (id(bg_cur_bot_r) - id(bg_cur_top_r)) * curve);
          uint8_t g = (uint8_t)(id(bg_cur_top_g) + (id(bg_cur_bot_g) - id(bg_cur_top_g)) * curve);
          uint8_t b = (uint8_t)(id(bg_cur_top_b) + (id(bg_cur_bot_b) - id(bg_cur_top_b)) * curve);
          it.filled_rectangle(0, y, 320, 2, Color(r, g, b));
        }

        // Luminance and contrast helper for adaptive foreground colors
        auto get_contrast_for_y = [&](int y_pos) {
          float f = (float)y_pos / 239.0f;
          float c = f * f * (3.0f - 2.0f * f);
          float r = id(bg_cur_top_r) + (id(bg_cur_bot_r) - id(bg_cur_top_r)) * c;
          float g = id(bg_cur_top_g) + (id(bg_cur_bot_g) - id(bg_cur_top_g)) * c;
          float b = id(bg_cur_top_b) + (id(bg_cur_bot_b) - id(bg_cur_top_b)) * c;
          float lum = 0.299f * r + 0.587f * g + 0.114f * b;
          bool is_light = (lum > 145.0f);
          Color fg_main = is_light ? Color(16, 20, 28) : Color(255, 255, 255);
          Color fg_muted = is_light ? Color(65, 75, 90) : Color(185, 195, 210);
          Color track = is_light ? Color(16, 20, 28, 45) : Color(255, 255, 255, 40);
          return std::make_tuple(fg_main, fg_muted, track);
        };

        // 2. Top status bar (WiFi signal, CPU thermal warning, Clock)
        auto [top_fg, top_muted, top_track] = get_contrast_for_y(6);
        float rssi = id(wifi_rssi).state;
        int bars = 0;
        if (!isnan(rssi)) {
          if (rssi >= -60.0f) bars = 4;
          else if (rssi >= -70.0f) bars = 3;
          else if (rssi >= -80.0f) bars = 2;
          else if (rssi >= -90.0f) bars = 1;
        }
        it.filled_circle(25, 12, 2, (bars >= 1) ? top_fg : top_track);
        Color w_c2 = (bars >= 2) ? top_fg : top_track;
        it.horizontal_line(22, 8, 7, w_c2);
        it.draw_pixel_at(21, 9, w_c2);
        it.draw_pixel_at(29, 9, w_c2);
        Color w_c3 = (bars >= 3) ? top_fg : top_track;
        it.horizontal_line(19, 4, 13, w_c3);
        it.draw_pixel_at(18, 5, w_c3);
        it.draw_pixel_at(32, 5, w_c3);

        float cpu_t = id(cpu_temp).state;
        if (!isnan(cpu_t) && cpu_t >= 65.0f) {
          it.printf(160, 2, id(font_hud), id(c_amber), TextAlign::TOP_CENTER, "CPU %.0f°C", cpu_t);
        }

        it.strftime(308, 4, id(font_clock), top_fg, TextAlign::TOP_RIGHT, "%H:%M", id(ha_time).now());

        // 3. Volume bar - instant 0ms read from id(vol_target)
        float raw_vol = id(vol_target);
        float user_vol = (raw_vol - 0.30f) / 0.70f;
        if (user_vol < 0.0f) user_vol = 0.0f;
        if (user_vol > 1.0f) user_vol = 1.0f;
        int vol_pct = (int)roundf(user_vol * 100.0f);

        auto [v_fg, v_mut, v_trk] = get_contrast_for_y(101);
        Color vol_base = v_fg;
        Color vol_dimmed = v_trk;

        it.printf(20, 37, id(font_hud), vol_base, TextAlign::TOP_CENTER, "VOL");
        it.filled_rectangle(19, 53, 3, 96, vol_dimmed);
        int v_h = (int)((vol_pct / 100.0f) * 96.0f);
        if (v_h > 0) it.filled_rectangle(19, 149 - v_h, 3, v_h, vol_base);
        it.filled_circle(20, 149 - v_h, 3, vol_base);
        it.printf(20, 155, id(font_hud), vol_base, TextAlign::TOP_CENTER, "%d%%", vol_pct);

        // 4. Floating borderless album cover with smooth crossfade
        int art_y = (int)(18.0f + (1.0f - id(cover_anim)) * 6.0f);
        if (show_next && !show_prev) {
          id(active_art_idx) = id(target_art_idx);
          id(art_transition) = 1.0f;
          show_prev = true;
          img_prev = img_next;
        }

        if (id(art_transition) < 1.0f && show_prev && show_next && id(active_art_idx) != id(target_art_idx)) {
          id(art_transition) += 0.07f;
          if (id(art_transition) >= 1.0f) {
            id(art_transition) = 1.0f;
            id(active_art_idx) = id(target_art_idx);
          }
          float t = id(art_transition);
          float t_smooth = t * t * (3.0f - 2.0f * t);
          int it_t = (int)(t_smooth * 256.0f);
          int inv_t = 256 - it_t;

          for (int py = 0; py < 128; ++py) {
            for (int px = 0; px < 128; ++px) {
              Color c0 = img_prev->get_pixel(px, py);
              Color c1 = img_next->get_pixel(px, py);
              uint8_t r = (uint8_t)((c0.r * inv_t + c1.r * it_t) >> 8);
              uint8_t g = (uint8_t)((c0.g * inv_t + c1.g * it_t) >> 8);
              uint8_t b = (uint8_t)((c0.b * inv_t + c1.b * it_t) >> 8);
              it.draw_pixel_at(96 + px, art_y + py, Color(r, g, b));
            }
          }
        } else if (show_prev) {
          it.image(96, art_y, img_prev);
        } else {
          it.circle(160, 82, 44, top_track);
          it.circle(160, 82, 28, top_muted);
          it.circle(160, 82, 14, top_fg);
          it.filled_circle(160, 82, 3, top_fg);
        }

        // 5. Track title and artist
        auto [txt_fg, txt_muted, txt_trk] = get_contrast_for_y(160);
        const std::string &title = id(media_title).state.empty() ? "Ready to Play" : id(media_title).state;
        const std::string &artist = id(media_artist).state.empty() ? "Music Assistant" : id(media_artist).state;

        if (title.length() > 24) {
          int max_s = (int)title.length() - 21;
          int cycle = (int)((millis() / 260) % (max_s + 6));
          int offset = (cycle < 3) ? 0 : ((cycle > max_s + 3) ? max_s : cycle - 3);
          it.printf(160, 152, id(font_title), txt_fg, TextAlign::TOP_CENTER, "%.22s", title.c_str() + offset);
        } else {
          it.printf(160, 152, id(font_title), txt_fg, TextAlign::TOP_CENTER, "%s", title.c_str());
        }
        it.printf(160, 168, id(font_artist), txt_muted, TextAlign::TOP_CENTER, "%.30s", artist.c_str());

        // 6. Smooth progress bar with playback state icon
        static uint32_t last_calc_ms = 0;
        static float smooth_pos = 0.0f;
        static float last_seen_pos = -1.0f;

        float rep_pos = id(media_position).state;
        if (isnan(rep_pos)) rep_pos = 0.0f;

        uint32_t now_ms = millis();
        if (rep_pos != last_seen_pos) {
          last_seen_pos = rep_pos;
          smooth_pos = rep_pos;
          last_calc_ms = now_ms;
        } else if (is_playing && (now_ms - last_calc_ms >= 40)) {
          smooth_pos += (now_ms - last_calc_ms) / 1000.0f;
          last_calc_ms = now_ms;
        }

        float dur = id(media_duration).state;
        if (isnan(dur)) dur = 0.0f;
        if (dur > 0.0f && smooth_pos > dur) smooth_pos = dur;

        int cur_s = (int)smooth_pos;
        int dur_s = (int)dur;

        auto [bar_fg, bar_muted, bar_track] = get_contrast_for_y(190);

        if (is_playing) {
          for (int i = 0; i < 7; ++i) {
            it.vertical_line(15 + i, 187 + (i + 1) / 2, 8 - (i / 2) * 2, bar_fg);
          }
        } else if (is_paused) {
          it.filled_rectangle(15, 187, 2, 8, bar_fg);
          it.filled_rectangle(19, 187, 2, 8, bar_fg);
        } else {
          it.filled_circle(17, 191, 2, bar_muted);
        }

        it.printf(27, 186, id(font_hud), bar_muted, "%02d:%02d", cur_s / 60, cur_s % 60);
        if (dur_s > 0) {
          it.printf(304, 186, id(font_hud), bar_muted, TextAlign::TOP_RIGHT, "%02d:%02d", dur_s / 60, dur_s % 60);
        } else {
          it.printf(304, 186, id(font_hud), bar_fg, TextAlign::TOP_RIGHT, "LIVE");
        }

        it.filled_rectangle(64, 190, 196, 3, bar_track);
        if (dur_s > 0) {
          float pct = smooth_pos / (float)dur_s;
          if (pct > 1.0f) pct = 1.0f;
          if (pct < 0.0f) pct = 0.0f;
          int pw = (int)(pct * 196.0f);
          if (pw > 0) it.filled_rectangle(64, 190, pw, 3, bar_fg);
          it.filled_circle(64 + pw, 191, 3, bar_fg);
        }

        // 7. Bottom BASS and TREBLE indicators with adaptive contrast
        auto [bt_fg, bt_muted, bt_track] = get_contrast_for_y(218);
        Color bt_mark = (bt_fg == Color(255, 255, 255)) ? Color(255, 255, 255, 80) : Color(16, 20, 28, 90);

        bool b_active = (fabsf(b_db) >= 0.1f);
        Color b_col = b_active ? bt_fg : bt_muted;
        it.printf(36, 206, id(font_hud), b_col, "BASS %+ddB", (int)roundf(b_db));
        it.horizontal_line(36, 222, 108, bt_track);
        it.vertical_line(90, 219, 6, bt_mark);
        int b_dot = 90 + (int)roundf(b_db * 8.5f);
        if (b_dot < 36) b_dot = 36;
        if (b_dot > 144) b_dot = 144;
        it.filled_circle(b_dot, 222, 3, b_col);

        bool t_active = (fabsf(t_db) >= 0.1f);
        Color t_col = t_active ? bt_fg : bt_muted;
        it.printf(176, 206, id(font_hud), t_col, "TREBLE %+ddB", (int)roundf(t_db));
        it.horizontal_line(176, 222, 108, bt_track);
        it.vertical_line(230, 219, 6, bt_mark);
        int t_dot = 230 + (int)roundf(t_db * 8.5f);
        if (t_dot < 176) t_dot = 176;
        if (t_dot > 284) t_dot = 284;
        it.filled_circle(t_dot, 222, 3, t_col);

      } else {
        // =========================================================================
        // SCREEN 2: STANDBY / WEATHER & TEMPERATURES (ONBOARD ESP32-S3 SENSORS)
        // =========================================================================
        it.fill(Color(0, 0, 0));

        const Color petg_val(205, 212, 220);
        const Color petg_clock(180, 186, 194);
        const Color petg_lbl(125, 132, 140);

        it.strftime(160, 36, id(font_big), petg_clock, TextAlign::TOP_CENTER, "%H:%M", id(ha_time).now());

        // Room temperature from onboard AHT20 (fallback to onboard BMP280)
        float r_temp = !isnan(id(room_temp).state) ? id(room_temp).state : id(room_temp_bmp280).state;
        // Outdoor temperature from onboard DS18B20 (fallback to Home Assistant entity)
        float out_temp = !isnan(id(outdoor_temp_ds18b20).state) ? id(outdoor_temp_ds18b20).state : id(outdoor_temp_ha).state;

        // --- INDOOR (LEFT SIDE: X = 80) ---
        it.printf(80, 110, id(font_title), petg_lbl, TextAlign::TOP_CENTER, "INDOOR");
        if (!isnan(r_temp)) {
          it.printf(80, 134, id(font_big), petg_val, TextAlign::TOP_CENTER, "%.1f°", r_temp);
        } else {
          it.printf(80, 134, id(font_big), petg_lbl, TextAlign::TOP_CENTER, "--.-°");
        }

        // --- OUTDOOR (RIGHT SIDE: X = 240) ---
        it.printf(240, 110, id(font_title), petg_lbl, TextAlign::TOP_CENTER, "OUTDOOR");
        if (!isnan(out_temp)) {
          it.printf(240, 134, id(font_big), petg_val, TextAlign::TOP_CENTER, "%.1f°", out_temp);
        } else {
          it.printf(240, 134, id(font_big), petg_lbl, TextAlign::TOP_CENTER, "--.-°");
        }

        // Subtle humidity & atmospheric pressure status line (AHT20 + BMP280)
        float r_hum = id(room_humidity).state;
        float r_pres = id(atmospheric_pressure).state;
        if (!isnan(r_hum) && !isnan(r_pres)) {
          it.printf(160, 204, id(font_hud), petg_lbl, TextAlign::TOP_CENTER, "RH %.0f%%   |   %.0f hPa", r_hum, r_pres);
        } else if (!isnan(r_hum)) {
          it.printf(160, 204, id(font_hud), petg_lbl, TextAlign::TOP_CENTER, "HUMIDITY %.0f%%", r_hum);
        }
      }
